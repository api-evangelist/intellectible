aid: intellectible
name: Intellectible
description: >-
  Intellectible is an AI build platform for enterprise service providers -
  federal and state government contractors (GovCon), professional services
  firms, and economic development organizations - that turns portals, emails,
  CRM data, and market signals into structured opportunity, proposal, pricing,
  and knowledge workflows. Its horizontal build environment (project workspaces,
  visual workflows, document libraries, PostgreSQL databases, applications,
  pages, jobs, and queues) is exposed programmatically through the Intellectible
  Public API and a Code Execution SDK, letting teams run workflows synchronously,
  manage Library files, and query project databases directly from code.
