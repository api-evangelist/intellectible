description: >-
  First-party Intellectible client libraries. The Code Execution SDK is
  documented by the provider for use inside Intellectible code nodes, where it
  is "pre-installed and auto-authenticated" - it exposes a LibraryClient
  (list/upload/download/delete project files) and a DatabaseClient (create
  tables, run SQL, insert/update/delete rows, CSV import against the project
  PostgreSQL database). At probe time (2026-07-19) the documented package names
  did NOT resolve on the public npm or PyPI registries (registry HTTP status
  recorded below), consistent with them being distributed inside the code
  execution runtime rather than published for public install.
